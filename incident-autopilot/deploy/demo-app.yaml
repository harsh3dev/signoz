apiVersion: v1
kind: Namespace
metadata:
  name: autopilot-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-api
  namespace: autopilot-demo
  labels:
    app: checkout-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: checkout-api
  template:
    metadata:
      labels:
        app: checkout-api
    spec:
      readinessGates:
        - conditionType: autopilot.signoz.io/healthy
      containers:
        - name: checkout-api
          image: telemetry-shop:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          startupProbe:
            httpGet:
              path: /api/health/live
              port: 3000
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: 3000
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: 3000
            periodSeconds: 10
          env:
            - name: PORT
              value: "3000"
            - name: OTEL_SERVICE_NAME
              value: checkout-api
            - name: OTEL_DEPLOYMENT_ENVIRONMENT
              value: demo
            - name: SIGNOZ_OTLP_ENDPOINT
              value: http://host.docker.internal:4318
            - name: K8S_NAMESPACE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: K8S_DEPLOYMENT_NAME
              value: checkout-api
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: K8S_POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: CHAOS_ENABLED
              value: "false"
---
apiVersion: v1
kind: Service
metadata:
  name: checkout-api
  namespace: autopilot-demo
spec:
  selector:
    app: checkout-api
  ports:
    - port: 3000
      targetPort: 3000
      name: http
